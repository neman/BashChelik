name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install PC/SC (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite1
      - name: Build
        run: dotnet build BashChelik.slnx -c Release
      - name: Test (.NET 11, and .NET Framework 4.8 on Windows)
        run: dotnet test -c Release --no-build
